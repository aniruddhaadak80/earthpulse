name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the serverless API layer loads
        run: node -e "import('./api/events.js').then(() => console.log('api/events.js loads')).catch((e) => { console.error(e); process.exit(1); })"
      - name: Check the local API mirror answers
        run: |
          node server.js &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/events -o /tmp/events.json; then break; fi
            sleep 2
          done
          node -e "const d = require('/tmp/events.json'); if (d.status !== 'success') { throw new Error('unexpected payload'); } console.log('events:', d.data.length);"
